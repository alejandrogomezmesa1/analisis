<svg width="400" height="400" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo y borde exterior -->
  <rect x="0" y="0" width="440" height="440" fill="#2d2d2d" rx="10"/>
  <rect x="20" y="20" width="400" height="400" fill="#f0d9b5" stroke="#4a4a4a" stroke-width="4"/>

  <!-- Generación de las casillas del tablero -->
  <g fill="#b58863">
    <!-- Fila 8 (y=20) -->
    <rect x="70" y="20" width="50" height="50"/>
    <rect x="170" y="20" width="50" height="50"/>
    <rect x="270" y="20" width="50" height="50"/>
    <rect x="370" y="20" width="50" height="50"/>
    
    <!-- Fila 7 (y=70) -->
    <rect x="20" y="70" width="50" height="50"/>
    <rect x="120" y="70" width="50" height="50"/>
    <rect x="220" y="70" width="50" height="50"/>
    <rect x="320" y="70" width="50" height="50"/>
    
    <!-- Fila 6 (y=120) -->
    <rect x="70" y="120" width="50" height="50"/>
    <rect x="170" y="120" width="50" height="50"/>
    <rect x="270" y="120" width="50" height="50"/>
    <rect x="370" y="120" width="50" height="50"/>
    
    <!-- Fila 5 (y=170) -->
    <rect x="20" y="170" width="50" height="50"/>
    <rect x="120" y="170" width="50" height="50"/>
    <rect x="220" y="170" width="50" height="50"/>
    <rect x="320" y="170" width="50" height="50"/>
    
    <!-- Fila 4 (y=220) -->
    <rect x="70" y="220" width="50" height="50"/>
    <rect x="170" y="220" width="50" height="50"/>
    <rect x="270" y="220" width="50" height="50"/>
    <rect x="370" y="220" width="50" height="50"/>
    
    <!-- Fila 3 (y=270) -->
    <rect x="20" y="270" width="50" height="50"/>
    <rect x="120" y="270" width="50" height="50"/>
    <rect x="220" y="270" width="50" height="50"/>
    <rect x="320" y="270" width="50" height="50"/>
    
    <!-- Fila 2 (y=320) -->
    <rect x="70" y="320" width="50" height="50"/>
    <rect x="170" y="320" width="50" height="50"/>
    <rect x="270" y="320" width="50" height="50"/>
    <rect x="370" y="320" width="50" height="50"/>
    
    <!-- Fila 1 (y=370) -->
    <rect x="20" y="370" width="50" height="50"/>
    <rect x="120" y="370" width="50" height="50"/>
    <rect x="220" y="370" width="50" height="50"/>
    <rect x="320" y="370" width="50" height="50"/>
  </g>

  <!-- Coordenadas Verticales (Números 1-8) -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    <!-- Izquierda -->
    <text x="10" y="45">8</text>
    <text x="10" y="95">7</text>
    <text x="10" y="145">6</text>
    <text x="10" y="195">5</text>
    <text x="10" y="245">4</text>
    <text x="10" y="295">3</text>
    <text x="10" y="345">2</text>
    <text x="10" y="395">1</text>
    <!-- Derecha -->
    <text x="430" y="45">8</text>
    <text x="430" y="95">7</text>
    <text x="430" y="145">6</text>
    <text x="430" y="195">5</text>
    <text x="430" y="245">4</text>
    <text x="430" y="295">3</text>
    <text x="430" y="345">2</text>
    <text x="430" y="395">1</text>
  </g>

  <!-- Coordenadas Horizontales (Letras a-h) -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    <!-- Arriba -->
    <text x="45" y="10">A</text>
    <text x="95" y="10">B</text>
    <text x="145" y="10">C</text>
    <text x="195" y="10">D</text>
    <text x="245" y="10">E</text>
    <text x="295" y="10">F</text>
    <text x="345" y="10">G</text>
    <text x="395" y="10">H</text>
    <!-- Abajo -->
    <text x="45" y="430">A</text>
    <text x="95" y="430">B</text>
    <text x="145" y="430">C</text>
    <text x="195" y="430">D</text>
    <text x="245" y="430">E</text>
    <text x="295" y="430">F</text>
    <text x="345" y="430">G</text>
    <text x="395" y="430">H</text>
  </g>
  
  <!-- Marcador de direcciones cruzadas -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Flechas en cruz desde el centro -->
    <path d="M220 220 L 220 120" stroke="#ff4444" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 220 320" stroke="#ff4444" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 120 220" stroke="#ff4444" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 320 220" stroke="#ff4444" stroke-width="4" marker-end="url(#arrowhead)"/>
    <!-- Flechas diagonales -->
    <path d="M220 220 L 149 149" stroke="#4488ff" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 291 149" stroke="#4488ff" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 149 291" stroke="#4488ff" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M220 220 L 291 291" stroke="#4488ff" stroke-width="4" marker-end="url(#arrowhead)"/>
    
    <!-- Centro -->
    <circle cx="220" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- Definiciones para las flechas -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="context-stroke"/>
    </marker>
  </defs>

</svg>
